name: alertsense
description: "AI Environmental Sound Awareness System — Turn important sounds into alerts you can see and feel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # AI & Audio
  # tflite_flutter: ^0.11.0
  record: ^7.1.1

  # Alerts & Hardware
  vibration: ^2.0.0
  torch_light: ^1.0.0
  flutter_local_notifications: ^17.2.1
  flutter_foreground_task: ^8.5.0

  # Database & Storage
  shared_preferences: ^2.3.1
  path_provider: ^2.1.3

  # UI & Design
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  rxdart: ^0.28.0

  # PDF Export
  pdf: ^3.11.0

  # Home Widget
  home_widget: ^0.6.0

  # Icons
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/labels/
    - assets/animations/
    - assets/icon/
